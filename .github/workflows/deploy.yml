name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Package build artifact
        run: |
          cp ecosystem.config.js .next/standalone/
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/
          cp -r prisma .next/standalone/
          cp -r node_modules/prisma .next/standalone/node_modules/prisma
          cp -r node_modules/@prisma .next/standalone/node_modules/@prisma

          cd .next/standalone
          tar -czf ../../build.tar.gz .

      - name: Upload artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "build.tar.gz"
          target: "/var/www/ecard"
          overwrite: true

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }} # ripin
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            source $NVM_DIR/nvm.sh

            cd /var/www/ecard

            rm -rf next
            mkdir next

            # extract artifact ONCE
            tar -xzf build.tar.gz -C next
            rm build.tar.gz

            # Ensure persistent directories
            mkdir -p /var/www/ecard/data
            mkdir -p /var/www/ecard/uploads

            # atomic swap (clean previous first to avoid nested dirs)
            rm -rf previous
            mv current previous || true
            mv next current

            # Symlink uploads to persistent directory
            rm -rf current/public/uploads
            ln -s /var/www/ecard/uploads current/public/uploads

            cd current

            # Push schema to DB (creates tables on first deploy, safe no-op after)
            DATABASE_URL="file:/var/www/ecard/data/app.db" node node_modules/prisma/build/index.js db push

            # start if missing, reload if exists
            pm2 describe ecard-next > /dev/null \
              && pm2 reload ecard-next --update-env \
              || pm2 start ecosystem.config.js

            echo "✅ Deploy complete!"
