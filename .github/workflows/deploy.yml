name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build application
        run: npm run build

      - name: Package build artifact
        run: |
          cp ecosystem.config.js .next/standalone/
          cp -r public .next/standalone/
          cp -r .next/static .next/standalone/.next/

          cd .next/standalone
          tar -czf ../../build.tar.gz .

      - name: Upload artifact to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }} # ripin
          key: ${{ secrets.SSH_KEY }}
          source: "build.tar.gz"
          target: "/var/www/ecard"

      - name: Deploy on server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }} # ripin
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e

            export NVM_DIR="$HOME/.nvm"
            source $NVM_DIR/nvm.sh

            cd /var/www/ecard

            rm -rf next
            mkdir next

            tar -xzf build.tar.gz -C next
            rm build.tar.gz

            mv current previous || true
            mv next current


            tar -xzf build.tar.gz -C current
            rm build.tar.gz

            pm2 describe ecard-next > /dev/null \
              && pm2 reload ecard-next --update-env \
              || pm2 start ecosystem.config.js


            echo "==> Deployed commit:"
            echo "${GITHUB_SHA}" | cut -c1-7

            echo "✅ Deploy complete!"
